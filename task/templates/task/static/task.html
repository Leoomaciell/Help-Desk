<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="styles/style.css">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
</head>
<body>
    {% csrf_token %}
    
    <header>
        <h1>HelpDesk</h1>

        <div>
            <i class="material-icons">chat bubble</i>
            <i class="material-icons">person</i>
        </div>
    </header>

    <menu>
        <ul>
            <li>
                <p>Meus Chamados</p>
            </li>

            <li>
                <p>Novo Chamado</p>
            </li>

            <li>
                <p>Histórico</p>
            </li>
        </ul>
    </menu>

    <main>
        <section id="dashboard">
            <h2>Dashboard</h2>
            
            <div id="cards">
                <div class="card">
                    <h2>Total de Chamados</h2>
            
                    <p>Número</p>
                </div>
                <div class="card">
                    <h2>Chamados Abertos</h2>
                    <p>Número</p>
                </div>
                <div class="card">
                    <h2>Chamados em Andamento</h2>
                    <p>Número</p>
                </div>
                <div class="card">
                    <h2>Chamados Fechados Hoje</h2>
                    <p>Número</p>
                </div>
            </div>
        </section>

        <section id="historico"></section>
    </main>
</body>
</html>
